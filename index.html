<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Time Clock</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --subtext: #94a3b8;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .clock-card {
      background: var(--card);
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      width: 100%;
      max-width: 360px;
    }
    .title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--subtext);
      margin-bottom: 8px;
    }
    .time-display {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      margin: 10px 0;
    }
    .status {
      font-size: 16px;
      margin-bottom: 24px;
    }
    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    input[type="time"] {
      background: #334155;
      border: none;
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.97);
    }
    .note {
      margin-top: 15px;
      font-size: 12px;
      color: var(--subtext);
    }
  </style>
</head>
<body>

<div class="clock-card">
  <div class="title">Ігровий час</div>
  <div class="time-display" id="gameTime">00:00:00</div>
  <div class="status" id="dayStatus">☀️ День</div>

  <div class="controls">
    <input type="time" id="syncInput" step="1" value="12:00">
    <button onclick="syncTime()">Синхронізувати</button>
  </div>
  <div class="note">Вкажи поточний точний час у грі та тисни кнопку.</div>
</div>

<script>
  // 1 ігрова хвилина = 2.5 реальних секунди => 2.5 / 60
  const GAME_SEC_IN_REAL_SEC = 2.5 / 60; 
  
  // Зберігаємо точку відліку в LocalStorage
  let anchorRealTime = localStorage.getItem('anchorRealTime') 
    ? parseFloat(localStorage.getItem('anchorRealTime')) 
    : Date.now();
    
  let anchorGameSec = localStorage.getItem('anchorGameSec') 
    ? parseFloat(localStorage.getItem('anchorGameSec')) 
    : 12 * 3600; // за замовчуванням 12:00:00

  function updateClock() {
    const now = Date.now();
    const elapsedRealSec = (now - anchorRealTime) / 1000;
    
    // Рахуємо скільки ігрових секунд минуло
    let totalGameSec = anchorGameSec + (elapsedRealSec / GAME_SEC_IN_REAL_SEC);
    
    // В добі 86400 ігрових секунд (24 години)
    totalGameSec = totalGameSec % 86400;
    if (totalGameSec < 0) totalGameSec += 86400;

    const hours = Math.floor(totalGameSec / 3600);
    const minutes = Math.floor((totalGameSec % 3600) / 60);
    const seconds = Math.floor(totalGameSec % 60);

    const format = num => String(num).padStart(2, '0');
    
    document.getElementById('gameTime').textContent = 
      `${format(hours)}:${format(minutes)}:${format(seconds)}`;

    // Визначаємо день/ніч (наприклад, день з 06:00 до 21:00)
    const isDay = hours >= 6 && hours < 21;
    document.getElementById('dayStatus').textContent = isDay ? "☀️ День" : "🌙 Ніч";
  }

  function syncTime() {
    const inputVal = document.getElementById('syncInput').value;
    if (!inputVal) return;

    const parts = inputVal.split(':');
    const h = parseInt(parts[0]) || 0;
    const m = parseInt(parts[1]) || 0;
    const s = parts[2] ? parseInt(parts[2]) : 0;

    anchorGameSec = (h * 3600) + (m * 60) + s;
    anchorRealTime = Date.now();

    localStorage.setItem('anchorRealTime', anchorRealTime);
    localStorage.setItem('anchorGameSec', anchorGameSec);

    updateClock();
  }

  setInterval(updateClock, 100);
  updateClock();
</script>

</body>
</html>
